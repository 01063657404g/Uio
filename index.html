<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار ببساطة التربوي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>
/* Layout: official light exam portal. Navy header band with gold rule, single centered column, one question per screen with a numbered navigator, watermark tiled behind every question card. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16233B; --ink-2:#4B5973; --line:#D6DDE9;
  --navy:#1B3A6B; --navy-deep:#112847; --gold:#B58A2E; --gold-soft:#F7F0DC;
  --sel:#E7EDF8; --ok:#1C7A4E; --ok-bg:#E3F3EA; --bad:#B3261E; --bad-bg:#FBE8E6;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--navy);border-bottom:4px solid var(--gold);color:#fff}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:8px;background:var(--gold);color:var(--navy-deep);display:grid;place-items:center;font:800 30px/1 var(--display);padding-bottom:4px}
.wordmark{display:flex;flex-direction:column;line-height:1.25}
.wordmark b{font:800 22px/1.2 var(--display);letter-spacing:.3px}
.wordmark small{font-size:12px;color:#C9D5EA}
.tagline{font-size:13px;color:#D9E2F2}

main{padding-block:20px 96px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.5}

/* cards */
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.card>*:not(.wm){position:relative;z-index:1}
.wm{position:absolute;inset:-45%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:30px 44px;transform:rotate(-24deg);pointer-events:none;user-select:none;-webkit-user-select:none;z-index:0}
.wm span{font:800 24px/1.4 var(--display);color:var(--navy);opacity:.07;white-space:nowrap}

/* start */
.hero{display:grid;gap:14px}
.hero h1{font-size:26px;color:var(--navy-deep)}
.hero p{margin:0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.fact{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center;background:#FAFBFD}
.fact b{display:block;font:700 20px/1.3 var(--display);color:var(--navy)}
.fact span{font-size:13px;color:var(--ink-2)}
.group{display:grid;gap:8px;margin-top:14px}
.group>label,.group>.lbl{font-weight:700;color:var(--navy-deep)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 120px;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:10px 12px;font-weight:600;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:13.5px;color:var(--ink-2);margin:0}
.rules{margin:0;padding-inline-start:20px;color:var(--ink-2);font-size:15px}
.rules li{margin-block:2px}
.note{background:var(--gold-soft);border:1px solid #E6D6A8;border-radius:6px;padding:10px 12px;font-size:14px;color:#5B4510}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:11px 20px;font-weight:700;min-height:48px}
.btn:hover{background:var(--navy-deep)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:var(--sel)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1503}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* quiz bar */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.sticky .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.timer{font:700 18px/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums;direction:ltr}
.timer.low{color:var(--bad)}
.row2{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.row2 b{color:var(--ok)}
.prog{height:6px;background:#E6EBF3;border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0}

.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-weight:700;color:var(--navy)}
.chip{font-size:12.5px;background:var(--gold-soft);color:#5B4510;border:1px solid #E6D6A8;border-radius:999px;padding:2px 10px}
.qtext{font-size:19px;color:var(--ink);margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:start;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;color:var(--ink);min-height:52px}
.opt .lt{flex:0 0 30px;height:30px;border-radius:5px;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:15px;background:#fff}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
button.opt:not(:disabled):hover{border-color:var(--navy);background:#F7F9FD}
.opt.sel{background:var(--sel);border-color:var(--navy)}
.opt.sel .lt{background:var(--navy);color:#fff}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt .tag{font-size:12px;font-weight:600;white-space:nowrap;padding-top:4px}
.opt.ok .tag{color:var(--ok)}
.opt.bad .tag{color:var(--bad)}
.exp{margin-top:14px;border-radius:6px;padding:12px 14px;font-size:15px;border:1px solid var(--line);background:#F8FAFD}
.exp b{color:var(--navy-deep)}
.exp.ok{background:var(--ok-bg);border-color:#BFE2CF}
.exp.bad{background:var(--bad-bg);border-color:#F1C6C2}

.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.confirm{margin-top:14px;background:var(--gold-soft);border:1px solid #E6D6A8;border-radius:8px;padding:14px;display:grid;gap:10px}
.confirm .nav{margin:0}

.navigator{margin-top:14px}
.navigator h3{font-size:15px;margin-bottom:10px;color:var(--navy-deep)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{height:40px;border:1.5px solid var(--line);background:#fff;border-radius:5px;font-weight:600;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--sel);border-color:#A9BCDD}
.grid button.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.grid button.g-ok{background:var(--ok-bg);border-color:var(--ok)}
.grid button.g-bad{background:var(--bad-bg);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);vertical-align:-1px;margin-inline-end:5px}

/* result */
.score{display:grid;gap:14px;text-align:center}
.big{font:800 54px/1.1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--ink-2);font-weight:600}
.verdict{display:inline-block;margin-inline:auto;border-radius:999px;padding:4px 16px;font-weight:700;background:var(--gold-soft);border:1px solid #E6D6A8;color:#5B4510}
.verdict.pass{background:var(--ok-bg);border-color:#BFE2CF;color:var(--ok)}
.verdict.fail{background:var(--bad-bg);border-color:#F1C6C2;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:6px;padding:10px;border:1px solid var(--line);background:#FAFBFD}
.stat b{display:block;font:700 24px/1.3 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.topics{display:grid;gap:12px;margin-top:6px;text-align:start}
.topic .t{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:4px}
.topic .t span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar{height:8px;background:#E6EBF3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 180px}
.sec{margin-top:22px;display:grid;gap:14px}
.sec>h2{font-size:20px;color:var(--navy-deep)}
.review{display:grid;gap:14px}
.review .card{padding:18px}

.btn{text-decoration:none}
.seg button small{font-weight:500;color:inherit;opacity:.8}
.sub{display:grid;gap:12px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:8px;padding:14px}
.sub .subtxt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sub .subtxt b{font-family:var(--display);color:var(--navy-deep)}
.sub .subtxt span{font:800 22px/1.2 var(--display);color:var(--navy)}
.subbtns{display:flex;gap:10px;flex-wrap:wrap}
.subbtns .btn{flex:1 1 150px}

.homebtn{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.homebtn:hover{background:rgba(255,255,255,.12)}
.models{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--navy);border:1.5px solid var(--navy);color:#fff;border-radius:8px;padding:14px 10px;min-height:76px}
.mbtn:hover,.mbtn:active{background:var(--navy-deep)}
.mbtn b{font:700 18px/1.4 var(--display)}
.mbtn small{font-size:13px;color:#D9E2F2}
.card.shot{border-top:4px solid var(--gold);padding:16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.brand2{display:flex;align-items:center;gap:8px;color:var(--navy-deep)}
.brand2 b{font:800 18px/1.2 var(--display)}
.mark.sm{width:32px;height:32px;border-radius:6px;font-size:20px;padding-bottom:2px}
.sline{font-size:13.5px;font-weight:600;color:var(--navy)}
.qtopic{margin-bottom:8px}
.sfoot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--ink-2)}
.shot .qtext{font-size:18.5px;line-height:1.75;margin-bottom:14px}
.shot .opts{gap:10px}
.shot .opt{border-radius:10px;border:1.5px solid #BFCBE0;background:#fff;padding:12px 14px;min-height:56px;font-size:16.5px;line-height:1.65;align-items:center}
.shot .opt .lt{flex:0 0 34px;height:34px;border-radius:50%;font-size:16px}
.shot .opt .tx{padding-top:0}
.confirm.leave{margin:0 0 14px}
.shot .opt.sel{background:var(--sel);border-color:var(--navy)}
.shot .opt.sel .lt{background:var(--navy);border-color:var(--navy);color:#fff}
.shot .opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.shot .opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.shot .opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.shot .opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.wa[hidden]{display:none}

/* footer + whatsapp */
.foot{background:var(--navy-deep);color:#D9E2F2;border-top:4px solid var(--gold);margin-top:8px}
.foot .in{padding-block:20px;display:grid;gap:6px;font-size:14px;text-align:center}
.foot b{color:#fff;font-family:var(--display)}
.foot .num{direction:ltr;unicode-bidi:isolate;font-weight:700;color:#fff;user-select:all}
.foot a{color:#fff}
.wa{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:#1FA855;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:11px 18px 11px 14px;box-shadow:0 4px 14px rgba(17,40,71,.28)}
.wa:hover{background:#188A46}
.wa svg{width:24px;height:24px;flex:none}

@media (max-width:480px){
  .hero h1{font-size:22px}
  .qtext{font-size:17.5px}
  .big{font-size:44px}
  .wa span{display:none}
  .wa{padding:12px}
  .tagline{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
/* ===== بنك الأسئلة: الإجابة الصحيحة دائمًا أول خيار، ويُخلط ترتيب الخيارات تلقائيًا عند بدء كل محاولة ===== */
const BANK=[
{t:"نظريات التعلم",q:"صاحب نظرية النمو المعرفي التي قسّمت نمو التفكير إلى أربع مراحل هو:",o:["جان بياجيه","فيجوتسكي","سكنر","برونر"],e:"بياجيه: الحسية الحركية، ثم ما قبل العمليات، ثم العمليات المحسوسة، ثم العمليات المجردة."},
{t:"نظريات التعلم",q:"تُسمّى المرحلة من الميلاد حتى عمر سنتين تقريبًا عند بياجيه مرحلة:",o:["الحسية الحركية","ما قبل العمليات","العمليات المحسوسة","العمليات المجردة"],e:"يتعلم الطفل فيها عن طريق الحواس والحركة، ويكتسب مفهوم ثبات الأشياء."},
{t:"نظريات التعلم",q:"مفهوم «منطقة النمو القريبة» ينسب إلى:",o:["فيجوتسكي","بافلوف","ثورندايك","باندورا"],e:"هي الفرق بين ما يستطيع المتعلم إنجازه بمفرده وما يستطيعه بمساعدة معلم أو زميل أكثر خبرة."},
{t:"نظريات التعلم",q:"صاحب تجارب الكلب واللعاب في الاشراط الكلاسيكي:",o:["بافلوف","سكنر","ثورندايك","كوهلر"],e:"بافلوف: ربط مثير محايد (الجرس) بمثير طبيعي (الطعام) حتى يصبح الجرس وحده يستدعي الاستجابة."},
{t:"نظريات التعلم",q:"ارتبط الاشراط الإجرائي (الفعّال) باسم:",o:["سكنر","بافلوف","بياجيه","أوزوبل"],e:"سكنر: السلوك يتشكل بحسب نتائجه، فالتعزيز يزيد تكراره والعقاب يقلله."},
{t:"نظريات التعلم",q:"صاحب نظرية التعلم بالملاحظة والنمذجة (التعلم الاجتماعي):",o:["ألبرت باندورا","جيروم برونر","ماسلو","إريكسون"],e:"يتعلم الطفل بملاحظة سلوك النماذج المحيطة به وتقليده."},
{t:"نظريات التعلم",q:"ارتبطت نظرية «التعلم بالاكتشاف» باسم:",o:["جيروم برونر","سكنر","ثورندايك","باندورا"],e:"برونر: يكتشف المتعلم المفاهيم والعلاقات بنفسه بتوجيه من المعلم."},
{t:"نظريات التعلم",q:"«قانون الأثر» من قوانين التعلم عند:",o:["ثورندايك","بافلوف","كوهلر","فيجوتسكي"],e:"السلوك الذي يعقبه نتائج مرضية يزداد تكراره، وقوانينه: الأثر والتمرين والاستعداد."},
{t:"نظريات التعلم",q:"التعلم بالاستبصار (الفهم المفاجئ للعلاقات) تتبناه مدرسة:",o:["الجشطالت","السلوكية","الإنسانية","التحليل النفسي"],e:"وارتبطت بتجارب كوهلر على القردة."},
{t:"نظريات التعلم",q:"ارتبط «التعلم ذو المعنى» باسم:",o:["ديفيد أوزوبل","سكنر","بافلوف","ثورندايك"],e:"أوزوبل: يتحقق التعلم حين تُربط المعلومة الجديدة بالبنية المعرفية السابقة عند المتعلم."},
{t:"علم نفس النمو",q:"يبدأ هرم ماسلو للحاجات بالحاجات:",o:["الفسيولوجية","الأمان","الاجتماعية","تحقيق الذات"],e:"الترتيب: فسيولوجية، أمان، انتماء وحب، تقدير، تحقيق الذات."},
{t:"علم نفس النمو",q:"صاحب نظرية الذكاءات المتعددة:",o:["هوارد جاردنر","سبيرمان","ثورستون","فرويد"],e:"جاردنر: لكل متعلم أنماط ذكاء متنوعة كاللغوي والمنطقي والمكاني والاجتماعي وغيرها."},

let S={screen:'start',mode:'practice',leave:false,model:0,count:0,Q:[],ans:[],cur:0,t:0,total:0,tid:null,confirm:false,filter:'all'};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wm(){return '<div class="wm" aria-hidden="true">'+'<span>ببساطة</span>'.repeat(110)+'</div>';}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function build(){
  const src=MODELS[S.model];S.count=src.length;
  S.Q=shuffle(src).map(x=>{const order=shuffle([0,1,2,3]);return {t:x.t,q:x.q,e:x.e||'',o:order.map(k=>x.o[k]),a:order.indexOf(0)};});
  S.ans=S.Q.map(()=>null);S.cur=0;S.confirm=false;S.filter='all';
  S.total=EXAM_MIN*60;S.t=S.total;
}

function goHome(){clearInterval(S.tid);S.screen='start';S.leave=false;S.confirm=false;renderStart();}
function toTop(){window.scrollTo({top:0,behavior:'auto'});}

function renderStart(){
  waShow(true);
  main.innerHTML=`
  <section class="card hero">${wm()}
    <h1>اختبار محاكي لمسابقة معلم مساعد</h1>
    <p>الجهاز المركزي للتنظيم والإدارة · المحور التربوي · لجميع التخصصات</p>
    <div class="facts">
      <div class="fact"><b>${MODELS.length}</b><span>نماذج</span></div>
      <div class="fact"><b>${MODELS[0].length}</b><span>سؤالًا في كل نموذج</span></div>
      <div class="fact"><b>${EXAM_MIN} دقيقة</b><span>لكل اختبار</span></div>
      <div class="fact"><b>تلقائي</b><span>تصحيح فوري</span></div>
    </div>
    <div class="group"><span class="lbl">نمط الاختبار</span>
      <div class="seg" role="group" aria-label="نمط الاختبار">
        <button data-act="mode" data-v="practice" aria-pressed="${S.mode==='practice'}">تصحيح فوري بعد كل إجابة</button>
        <button data-act="mode" data-v="exam" aria-pressed="${S.mode==='exam'}">اختبار بالزمن (النتيجة في النهاية)</button>
      </div></div>
    <div class="group"><span class="lbl">اختر النموذج لبدء الاختبار</span>
      <div class="models" role="group" aria-label="النماذج">
        ${MODELS.map((m,i)=>`<button class="mbtn" data-act="model" data-v="${i}" type="button"><b>النموذج ${i+1}</b><small>${m.length} سؤالًا · ابدأ الآن</small></button>`).join('')}
      </div>
      <p class="hint">${S.mode==='exam'?'مدة كل اختبار '+EXAM_MIN+' دقيقة، ويُسلَّم تلقائيًا عند انتهاء الوقت، وتظهر النتيجة عند التسليم.':'مدة كل اختبار '+EXAM_MIN+' دقيقة، ويظهر الصواب والخطأ والتوضيح فور اختيار الإجابة.'}</p></div>
    <div class="group"><span class="lbl">تعليمات</span>
      <ul class="rules">
        <li>اختر إجابة واحدة لكل سؤال.</li>
        <li>مدة كل اختبار ${EXAM_MIN} دقيقة ويُسلَّم تلقائيًا عند انتهائها.</li>
        <li>يمكنك التنقل بين الأسئلة من لوحة الأرقام.</li>
        <li>التصحيح تلقائي: تظهر الدرجة والإجابات الصحيحة مع التوضيح.</li>
        <li>حد النجاح التقريبي 60%.</li>
      </ul></div>
    <div class="note">الأسئلة مبنية على نماذج الكفايات التربوية المتداولة ومسابقات التنظيم والإدارة، والاختبار للتدريب وليس اختبارًا رسميًا.</div>
    <div class="sub">
      <div class="subtxt"><b>الاشتراك في جميع النماذج</b><span>100 جنيه</span></div>
      <div class="subbtns">
        <a class="btn gold" href="${SUB_URL}" target="_blank" rel="noopener">اشترك الآن 100ج</a>
        <a class="btn ghost" href="${CHAT_URL}" target="_blank" rel="noopener">تواصل واتساب</a>
      </div>
    </div>
  </section>`;
  toTop();
}

function optClass(q,i,k){
  const a=S.ans[i],practice=S.mode==='practice';
  if(practice&&a!==null){if(k===q.a)return 'ok';if(k===a)return 'bad';return '';}
  return a===k?'sel':'';
}
function renderQuiz(){
  waShow(false);
  const i=S.cur,n=S.Q.length,q=S.Q[i],practice=S.mode==='practice';
  const answered=S.ans.filter(a=>a!==null).length,unans=n-answered;
  const locked=practice&&S.ans[i]!==null;
  const right=S.ans[i]===q.a;
  main.innerHTML=`
  ${S.leave?`<div class="confirm leave"><b>العودة للصفحة الرئيسية؟</b><span>سيتم إلغاء هذا الاختبار وفقدان إجاباتك.</span>
    <div class="nav"><button class="btn ghost" data-act="stay">متابعة الاختبار</button><button class="btn gold" data-act="leave">العودة للرئيسية</button></div></div>`:''}
  <div class="sticky">
    <div class="row"><span>النموذج ${S.model+1} · أُجيب عن <b>${answered}</b> من ${n}</span><span>الوقت المتبقي <span class="timer${S.t<=60?' low':''}" id="timer">${fmt(S.t)}</span></span></div>
    <div class="prog"><i style="width:${Math.round(answered/n*100)}%"></i></div>
    ${practice?`<div class="row2">تصحيح فوري · الإجابات الصحيحة: <b>${S.ans.filter((a,k)=>a===S.Q[k].a).length}</b></div>`:''}
  </div>
  <section class="card shot">${wm()}
    ${shead('النموذج '+(S.model+1)+' · سؤال '+(i+1)+' من '+n)}
    <div class="qtopic"><span class="chip">${q.t}</span></div>
    <h2 class="qtext">${q.q}</h2>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt ${optClass(q,i,k)}" data-act="pick" data-i="${k}" ${locked?'disabled':''}><span class="lt">${LETTERS[k]}</span><span class="tx">${o}</span></button>`).join('')}</div>
    ${locked?`<div class="exp ${right?'ok':'bad'}"><b>${right?'إجابة صحيحة.':'إجابة خاطئة.'}</b> الإجابة الصحيحة: ${LETTERS[q.a]}) ${q.o[q.a]}${q.e?'<br>'+q.e:''}</div>`:''}
    ${sfoot()}
  </section>
  ${S.confirm?`<div class="confirm"><b>${unans>0?`لديك ${unans} ${unans===1?'سؤال':'أسئلة'} بدون إجابة.`:'سيتم تسليم الاختبار الآن.'}</b><span>هل تريد التسليم وعرض النتيجة؟</span>
    <div class="nav"><button class="btn ghost" data-act="cancel">العودة للأسئلة</button><button class="btn gold" data-act="submit">تسليم الآن</button></div></div>`:`
  <div class="nav">
    <button class="btn ghost" data-act="prev" ${i===0?'disabled':''}>السابق</button>
    ${i<n-1?'<button class="btn" data-act="next">التالي</button>':'<button class="btn gold" data-act="finish">إنهاء الاختبار</button>'}
  </div>
  ${i<n-1?'<div class="nav"><button class="btn ghost" data-act="finish">إنهاء وتسليم الاختبار</button></div>':''}`}
  <section class="card navigator">
    <h3>لوحة الأسئلة</h3>
    <div class="grid">${S.Q.map((x,k)=>{let c='';const a=S.ans[k];if(k===i)c='cur';else if(a!==null){c=practice?(a===x.a?'g-ok':'g-bad'):'done';}return `<button class="${c}" data-act="jump" data-i="${k}" aria-label="السؤال ${k+1}">${k+1}</button>`;}).join('')}</div>
    <div class="legend"><span><i style="background:var(--navy);border-color:var(--navy)"></i>الحالي</span><span><i style="background:var(--sel);border-color:#A9BCDD"></i>تمت الإجابة</span><span><i></i>بدون إجابة</span></div>
  </section>`;
}

function reviewOpts(q,ch){
  return q.o.map((o,k)=>{
    const c=k===q.a?'ok':(k===ch?'bad':'');
    const tag=k===q.a?(k===ch?'إجابتك وهي الصحيحة':'الإجابة الصحيحة'):(k===ch?'إجابتك':'');
    return `<div class="opt ${c}"><span class="lt">${LETTERS[k]}</span><span class="tx">${o}</span>${tag?`<b class="tag">${tag}</b>`:''}</div>`;
  }).join('');
}
function renderResult(){
  waShow(true);
  const n=S.Q.length;let right=0,wrong=0,skip=0;const by={};
  S.Q.forEach((q,i)=>{const a=S.ans[i];by[q.t]=by[q.t]||{r:0,n:0};by[q.t].n++;if(a===null)skip++;else if(a===q.a){right++;by[q.t].r++;}else wrong++;});
  const pct=Math.round(right/n*100);
  const label=pct>=85?'ممتاز':pct>=70?'جيد جدًا':pct>=60?'جيد':'يحتاج إلى مراجعة';
  const cls=pct>=60?'pass':'fail';
  const used=fmt(S.total-S.t);
  const msg=encodeURIComponent(`ببساطة: نتيجتي في النموذج ${S.model+1} من اختبار ببساطة (معلم مساعد - تربوي) ${right} من ${n} (${pct}%)`);
  const list=S.Q.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>S.filter==='all'||x.a!==x.q.a);
  main.innerHTML=`
  <section class="card score">${wm()}
    <h1>نتيجة النموذج ${S.model+1}</h1>
    <div class="big">${right}<small> / ${n}</small></div>
    <div><span class="verdict ${cls}">${pct}% · ${label}</span></div>
    <div class="stats">
      <div class="stat ok"><b>${right}</b><span>صحيحة</span></div>
      <div class="stat bad"><b>${wrong}</b><span>خاطئة</span></div>
      <div class="stat"><b>${skip}</b><span>بدون إجابة</span></div>
    </div>
    ${used?`<p class="hint">الزمن المستغرق: ${used}</p>`:''}
    <div class="topics"><h3>الأداء حسب الموضوع</h3>
      ${Object.entries(by).map(([t,v])=>`<div class="topic"><div class="t"><span>${t}</span><span>${v.r} / ${v.n}</span></div><div class="bar"><i style="width:${Math.round(v.r/v.n*100)}%"></i></div></div>`).join('')}
    </div>
    <div class="actions">
      <button class="btn gold" data-act="home">الصفحة الرئيسية</button>
      <a class="btn ghost" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener" style="text-decoration:none">أرسل نتيجتك على واتساب</a>
      <a class="btn" href="${SUB_URL}" target="_blank" rel="noopener" style="text-decoration:none">اشترك 100ج</a>
    </div>
  </section>
  <div class="sec">
    <h2>مراجعة الإجابات</h2>
    <div class="seg" role="group" aria-label="تصفية المراجعة">
      <button data-act="filter" data-v="all" aria-pressed="${S.filter==='all'}">كل الأسئلة (${n})</button>
      <button data-act="filter" data-v="wrong" aria-pressed="${S.filter==='wrong'}">الخاطئة وغير المجابة (${wrong+skip})</button>
    </div>
    <div class="review">
    ${list.length?list.map(({q,i,a})=>`<article class="card shot">${wm()}
      ${shead('النموذج '+(S.model+1)+' · سؤال '+(i+1))}
      <div class="qtopic"><span class="chip">${q.t}</span></div>
      <h3 class="qtext">${q.q}</h3>
      <div class="opts">${reviewOpts(q,a)}</div>
      ${a===null?'<div class="exp bad"><b>لم تُجب عن هذا السؤال.</b></div>':''}
      ${q.e?`<div class="exp"><b>التوضيح:</b> ${q.e}</div>`:''}
      ${sfoot()}
    </article>`).join(''):'<div class="card"><b>أحسنت، لا توجد أسئلة خاطئة.</b></div>'}
    </div>
  </div>`;
  toTop();
}

function startTimer(){
  clearInterval(S.tid);
  S.tid=setInterval(()=>{
    S.t--;
    const el=document.getElementById('timer');
    if(el){el.textContent=fmt(S.t);el.classList.toggle('low',S.t<=60);}
    if(S.t<=0)doFinish();
  },1000);
}
function doFinish(){clearInterval(S.tid);S.screen='result';S.confirm=false;renderResult();}

const ACT={
  mode(d){S.mode=d.v;renderStart();},
  model(d){S.model=+d.v;ACT.start();},
  start(){build();S.leave=false;S.screen='quiz';renderQuiz();toTop();startTimer();},
  pick(d){
    const i=S.cur,k=+d.i;
    if(S.mode==='practice'&&S.ans[i]!==null)return;
    S.ans[i]=k;S.confirm=false;renderQuiz();
  },
  prev(){if(S.cur>0){S.cur--;S.confirm=false;renderQuiz();toTop();}},
  next(){if(S.cur<S.Q.length-1){S.cur++;S.confirm=false;renderQuiz();toTop();}},
  jump(d){S.cur=+d.i;S.confirm=false;renderQuiz();toTop();},
  finish(){S.confirm=true;renderQuiz();},
  cancel(){S.confirm=false;renderQuiz();},
  submit(){doFinish();},
  filter(d){S.filter=d.v;renderResult();},
  home(){if(S.screen==='quiz'){S.leave=true;renderQuiz();toTop();}else goHome();},
  stay(){S.leave=false;renderQuiz();},
  leave(){goHome();},
  retry(){goHome();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||!ACT[b.dataset.act])return;
  ACT[b.dataset.act](b.dataset);
});
renderStart();
</script>
</body>
</html>
